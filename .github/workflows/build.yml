name: 建置安裝檔（Windows）

on:
  push:
    branches: [main]
    paths: ['package.json', 'src/**', 'assets/**', 'build/**', 'scripts/fetch-engine.mjs', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --ignore-scripts
      - run: node --test test/

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: 下載 KataGo 引擎與權重
        run: node scripts/fetch-engine.mjs
      - name: electron-builder
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-win-x64
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: 建立 Release（版本號取自 package.json，同版本已存在則更新附件）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          ls -la out
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "小柯機器人圍棋競賽 $TAG" --notes-file .github/release-notes.md
          fi

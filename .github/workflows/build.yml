name: 建置安裝檔（Windows / macOS）

on:
  push:
    branches: [main]
    paths: ['package.json', 'src/**', 'assets/**', 'build/**', 'scripts/fetch-engine.mjs', 'scripts/build-katago-mac.sh', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --ignore-scripts
      - run: node --test test/

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis portable --x64
            name: win-x64
            arch: ''
          # Apple 晶片與 Intel Mac 各自編譯 KataGo（官方沒有 macOS 執行檔）
          - os: macos-latest
            args: --mac dmg --arm64
            name: mac-arm64
            arch: arm64
          - os: macos-latest
            args: --mac dmg --x64
            name: mac-x64
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: 下載（或編譯）KataGo 引擎與權重
        run: node scripts/fetch-engine.mjs
        env:
          KATAGO_ARCH: ${{ matrix.arch }}
      - name: electron-builder
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: 建立 Release（版本號取自 package.json，同版本已存在則更新附件）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          ls -la out
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "小柯機器人圍棋競賽 $TAG" --notes-file .github/release-notes.md
          fi

name: XiaokeGo
options:
  bundleIdPrefix: com.achir
  deploymentTarget:
    iOS: "17.0"
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "10300"
targets:
  XiaokeGo:
    type: application
    platform: iOS
    sources:
      - path: XiaokeGo
      - path: web            # 和電腦版同一份遊戲網頁（sync.sh 從 ../mobile/www 複製進來），整個資料夾放進 App
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.achir.xiaokego
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone 與 iPad；Mac 版是下面的 XiaokeGoMac
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7BN6XJ59KP      # Apple Developer Program（個人）；換帳號就改這裡
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: XiaokeGo/Info.plist
      properties:
        CFBundleDisplayName: 小柯圍棋
        CFBundleDevelopmentRegion: zh_TW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        # iPhone 直放（手機版面：上面玩家、中間棋盤、下面抽屜）；iPad 橫放（電腦版版面：左邊玩家、中間棋盤、右邊軍師／對話／音樂）
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: 與遠端棋友語音通話需要使用麥克風。
        NSLocalNetworkUsageDescription: 與同一個網路裡的棋友連線對賽時，需要使用區域網路建立點對點連線。
        UIFileSharingEnabled: true
  # Mac App Store 版：原生 macOS App（Apple 晶片＋Intel），同一份網頁遊戲，畫面用電腦版版面
  XiaokeGoMac:
    type: application
    platform: macOS
    sources:
      - path: XiaokeGo
        excludes:
          - XiaokeGoApp.swift
          - Assets.xcassets
          - Info.plist
      - path: Mac
        excludes:
          - Info.plist
      - path: web
        type: folder
    settings:
      base:
        PRODUCT_NAME: 小柯機器人圍棋競賽      # 「應用程式」資料夾裡顯示的名稱
        PRODUCT_MODULE_NAME: XiaokeGoMac
        PRODUCT_BUNDLE_IDENTIFIER: com.achir.xiaokego   # 和 iPhone／iPad 版同一個 Bundle ID：App Store 同一個項目
        ARCHS: "$(ARCHS_STANDARD)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7BN6XJ59KP
        CODE_SIGN_ENTITLEMENTS: Mac/Mac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: 小柯機器人圍棋競賽
        CFBundleName: 小柯機器人圍棋競賽
        CFBundleDevelopmentRegion: zh_TW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.board-games
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: © 2026 YU-JUH WU
        NSMicrophoneUsageDescription: 與遠端棋友語音通話需要使用麥克風。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  XiaokeGo:
    build:
      targets:
        XiaokeGo: all
    run:
      config: Debug
    archive:
      config: Release
  XiaokeGoMac:
    build:
      targets:
        XiaokeGoMac: all
    run:
      config: Debug
    archive:
      config: Release
